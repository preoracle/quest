<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary -->
    <title>Quest — Focus-first AI Tutor</title>
    <meta name="description" content="A focus-first AI tutor that helps you think in questions, reinforce weak edges, and build durable understanding." />
    <meta name="theme-color" content="#0a0a0f" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph (Discord, Slack, iMessage, LinkedIn, Facebook) -->
    <meta property="og:type"         content="website" />
    <meta property="og:title"        content="Quest — Focus-first AI Tutor" />
    <meta property="og:description"  content="Think in questions. Reinforce weak edges. Build durable understanding." />
    <meta property="og:image"        content="/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt"    content="Quest — Focus-first AI Tutor" />

    <!-- Twitter / X Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Quest — Focus-first AI Tutor" />
    <meta name="twitter:description" content="Think in questions. Reinforce weak edges. Build durable understanding." />
    <meta name="twitter:image"       content="/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Apply theme before first paint to prevent flash -->
    <script>
      (function(){
        var s=localStorage.getItem('quest:theme');
        var t=s||(window.matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
        document.documentElement.setAttribute('data-theme',t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

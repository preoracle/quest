<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="gold" x1="8" y1="6" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e8c47a"/>
      <stop offset="100%" stop-color="#d4a853"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle border -->
  <rect width="32" height="32" rx="7" fill="none" stroke="#2a2a36" stroke-width="0.75"/>
  <!-- Q letter — serif feel via paths -->
  <text
    x="16"
    y="23"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="21"
    font-weight="700"
    text-anchor="middle"
    fill="url(#gold)"
    letter-spacing="-0.5"
  >Q</text>
  <!-- Accent dot -->
  <circle cx="26" cy="6" r="2.5" fill="#d4a853" opacity="0.85"/>
</svg>

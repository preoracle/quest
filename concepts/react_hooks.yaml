topic: react_hooks
display_name: React Hooks
concepts:
- id: react_component_model
  name: React Component Model
  description: Probes understanding of functional vs class components, the render
    cycle, and why hooks were introduced as an alternative to lifecycle methods.
  prerequisites: []
- id: use_state
  name: useState
  description: Probes how useState declares local state in a functional component,
    the semantics of the state updater function, and how re-renders are triggered.
  prerequisites:
  - react_component_model
- id: use_effect
  name: useEffect
  description: Probes how useEffect schedules side effects after render, the role
    of the dependency array, and how the optional cleanup function prevents leaks.
  prerequisites:
  - use_state
- id: use_ref
  name: useRef
  description: Probes how useRef creates a mutable container that persists across
    renders without causing re-renders, and its dual use for DOM access and storing
    imperative values.
  prerequisites:
  - react_component_model
- id: use_context
  name: useContext
  description: Probes how useContext consumes a React context value, how it relates
    to the Context Provider tree, and when it triggers re-renders.
  prerequisites:
  - use_state
- id: use_reducer
  name: useReducer
  description: Probes the reducer pattern (state + action → state), when useReducer
    is preferred over useState, and how dispatch differs from a direct setter.
  prerequisites:
  - use_state
- id: use_memo_use_callback
  name: useMemo & useCallback
  description: Probes how useMemo memoizes computed values and useCallback memoizes
    function references, their dependency arrays, and the trade-offs of premature
    optimization.
  prerequisites:
  - use_effect
  - use_reducer
- id: rules_of_hooks
  name: Rules of Hooks
  description: Probes the two official rules (top-level calls only; call only from
    React functions), why they exist given hooks' linked-list implementation, and
    how the linter enforces them.
  prerequisites:
  - use_state
  - use_effect
- id: custom_hooks
  name: Custom Hooks
  description: Probes how to extract reusable stateful logic into a custom hook, naming
    conventions, and how custom hooks compose primitive hooks without sharing state
    between callers.
  prerequisites:
  - use_memo_use_callback
  - use_context
  - use_ref
  - rules_of_hooks
- id: common_pitfalls
  name: Common Hook Pitfalls
  description: Probes stale closure bugs, infinite effect loops from missing or incorrect
    dependencies, and object/function identity issues that break memoization.
  prerequisites:
  - custom_hooks

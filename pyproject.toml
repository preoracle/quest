[project]
name = "quest-ai"
version = "0.1.1"
description = "Quest — Socratic AI tutor that never gives the answer, only asks the next better question."
requires-python = ">=3.11"
readme = "README.md"
license = "LicenseRef-Proprietary"
authors = [{ name = "yuvrxj" }]
keywords = ["socratic", "tutor", "education", "langgraph", "spaced-repetition"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "prompt-toolkit>=3.0.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "httpx>=0.27.0"]
dev = ["pytest>=8.0.0", "httpx>=0.27.0", "build>=1.0", "twine>=5.0"]

[project.scripts]
quest = "cli:main"

[project.urls]
Homepage = "https://github.com/preoracle/quest"
Documentation = "https://github.com/preoracle/quest/blob/main/docs/PRODUCT.md"
Changelog = "https://github.com/preoracle/quest/blob/main/docs/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core", "db", "api", "quest_data"]
py-modules = ["cli"]

[tool.setuptools.package-data]
quest_data = ["prompts/*.txt", "concepts/*.yaml"]
db = ["schema.sql"]

[tool.pytest.ini_options]
markers = [
    "live: hits the real Anthropic API (run with pytest -m live)",
]
addopts = "-m 'not live'"

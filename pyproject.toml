[project]
name = "quest"
version = "0.1.0"
description = "Quest — a Socratic AI tutor that never gives the answer, only asks the next better question."
requires-python = ">=3.11"
readme = "docs/BRIEF.md"
dependencies = [
    "langchain>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
phase2 = ["pytest>=8.0.0"]
phase3 = ["langgraph>=0.2.0"]
phase4 = ["fastapi>=0.115.0", "uvicorn>=0.30.0", "httpx>=0.27.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["core"]
